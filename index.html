<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciclo de Estudos</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#e3e6ee;--ac:#2f6fed;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa1b2;--bd:#2c303c;--ac:#6b9bff}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa1b2;--bd:#2c303c;--ac:#6b9bff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:auto;padding:12px 12px 100px}
h2{font-size:18px;margin:16px 0 8px}h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mu);padding:8px 0 10px;font-size:clamp(11px,3.1vw,13px)}
.ic{font-size:26px;line-height:1;position:relative}.lb{white-space:nowrap}
.bd{position:absolute;top:-4px;right:-12px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:1.2;border-radius:99px;padding:1px 5px}
nav button.on{color:var(--ac);font-weight:700}
input,select,button.b{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);max-width:100%}
button.b{background:var(--ac);color:#fff;border:0;font-weight:600}button.g{background:none;color:var(--ac);border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.row>*{flex:1;min-width:0}
.big{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.mu{color:var(--mu);font-size:13px}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}
.chart i{width:100%;border-radius:6px 6px 0 0;min-height:2px;background:var(--ac)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.late{color:var(--bad)}.done{opacity:.5;text-decoration:line-through}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var BASEKEY="ciclo-estudos-v1",KEY=BASEKEY,COLORS=["#2f6fed","#16a34a","#f59e0b","#db2777","#7c3aed","#0891b2","#ea580c","#65a30d"];
var S=load(),tab="estudar",tick=null;S.plan=S.plan||{};
function loadKey(k){try{var r=localStorage.getItem(k);if(r)return JSON.parse(r)}catch(e){}return null}
function fresh(){return{subs:[],logs:[],revs:[],cycleStart:today(),timer:null,steps:"1,7,30",plan:{},upd:0}}
function load(){return loadKey(KEY)||fresh()}
function fix(){S.subs=S.subs||[];S.logs=S.logs||[];S.revs=S.revs||[];S.plan=S.plan||{};S.steps=S.steps||"1,7,30";S.cycleStart=S.cycleStart||today();S.cycleNo=S.cycleNo||1;S.cycles=S.cycles||[];S.upd=S.upd||0}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.upd=Date.now();saveLocal();push()}

var SBURL="https://lslxenjwfrzosavhqfrz.supabase.co",SBKEY="sb_publishable_YszZ3Oix_UG4jhRym3WIyg_hIwCN925";
var sb=null,user=null,needAuth=false,syncMsg="",pushT=null,syncOn=false;
try{sb=window.supabase.createClient(SBURL,SBKEY)}catch(e){sb=null}
function setSt(m){syncMsg=m;var e=document.getElementById("syncst");if(e)e.textContent=m}
function hora(){return new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function push(){if(!user||!sb)return;clearTimeout(pushT);pushT=setTimeout(doPush,700)}
function doPush(){if(!user||!sb)return;clearTimeout(pushT);var d=JSON.parse(JSON.stringify(S));d.timer=null;
  sb.from("user_data").upsert({user_id:user.id,data:d,updated_at:new Date().toISOString()}).then(function(r){setSt(r.error?"Falha ao sincronizar (sem conexão?)":"Sincronizado às "+hora())},function(){setSt("Falha ao sincronizar (sem conexão?)")})}
function pull(){if(!user||!sb)return;
  sb.from("user_data").select("data").eq("user_id",user.id).maybeSingle().then(function(r){var c=r.data&&r.data.data;
    if(c&&(c.upd||0)>(S.upd||0)){var tm=S.timer;S=c;S.timer=tm||null;fix();saveLocal();render()}
    if(!r.error)setSt("Sincronizado às "+hora())},function(){})}
function syncNow(){doPush();pull()}
function startSync(){if(syncOn)return;syncOn=true;document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()});setInterval(function(){if(!document.hidden)pull()},30000)}
function afterLogin(){
  needAuth=false;try{localStorage.removeItem("ciclo-guest")}catch(e){}
  var guestS=S,migrated=false;KEY=BASEKEY+"-"+user.id;S=loadKey(KEY);
  sb.from("user_data").select("data").eq("user_id",user.id).maybeSingle().then(function(r){
    var c=r.data&&r.data.data;
    if(c){var tm=S&&S.timer;S=c;S.timer=tm||null}
    else if(!S){S=guestS;migrated=true}
    fix();saveLocal();
    if(!c&&!r.error){doPush();if(migrated)try{localStorage.removeItem(BASEKEY)}catch(e){}}
    startSync();render()
  },function(){if(!S)S=guestS;fix();saveLocal();render()})}
function trErr(m){m=String(m||"");if(/Invalid login/i.test(m))return"E-mail ou senha incorretos.";if(/already registered/i.test(m))return"Este e-mail já tem conta. Clique em Entrar.";if(/not confirmed/i.test(m))return"Confirme seu e-mail antes de entrar.";if(/rate limit/i.test(m))return"Muitas tentativas. Aguarde um pouco.";return m}
function doAuth(m){var e=v("aemail").trim(),p=v("apass"),msg=document.getElementById("amsg");
  if(!e||p.length<6){msg.textContent="Informe e-mail e senha (mínimo 6 caracteres).";return}
  msg.textContent="Aguarde...";
  var pr=m=="up"?sb.auth.signUp({email:e,password:p}):sb.auth.signInWithPassword({email:e,password:p});
  pr.then(function(r){if(r.error){msg.textContent=trErr(r.error.message);return}
    if(!r.data.session){msg.textContent="Conta criada! Confirme o e-mail que enviamos e depois clique em Entrar.";return}
    user=r.data.session.user;afterLogin()},function(){msg.textContent="Sem conexão. Tente novamente."})}
function useGuest(){try{localStorage.setItem("ciclo-guest","1")}catch(e){}needAuth=false;render()}
function logout(){if(!confirm("Sair da conta? Seus dados continuam salvos na nuvem."))return;
  sb.auth.signOut().then(function(){try{localStorage.removeItem(KEY)}catch(e){}user=null;KEY=BASEKEY;S=load();fix();needAuth=true;render()})}
function init(){
  if(!sb){render();return}
  sb.auth.getSession().then(function(r){var ses=r.data&&r.data.session;
    if(ses){user=ses.user;afterLogin()}
    else{var g=false;try{g=!!localStorage.getItem("ciclo-guest")}catch(e){}needAuth=!g;render()}
  },function(){render()})}
function vAuth(){return'<div class="card" style="margin-top:40px"><h2 style="margin-top:0">📚 Ciclo de Estudos</h2><div class="mu" style="margin-bottom:10px">Entre para sincronizar seus dados entre celular e computador.</div>'
  +'<input id="aemail" type="email" placeholder="E-mail" autocomplete="email" style="width:100%;margin-bottom:8px"><input id="apass" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password" style="width:100%;margin-bottom:8px">'
  +'<div class="row"><button class="b" onclick="doAuth(\'in\')">Entrar</button><button class="b g" onclick="doAuth(\'up\')">Criar conta</button></div><div id="amsg" class="mu"></div>'
  +'<button class="b g" style="width:100%;margin-top:10px" onclick="useGuest()">Usar sem conta (só neste aparelho)</button></div>'}
function today(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return today(d)}
function uid(){return Math.random().toString(36).slice(2,9)}
function sub(id){return S.subs.find(function(s){return s.id==id})||{name:"?",color:"#888"}}
function fm(m){m=Math.round(m);var h=Math.floor(m/60);return h?h+"h"+String(m%60).padStart(2,"0"):m+"min"}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function elapsed(){var t=S.timer;if(!t)return 0;return t.acc+(t.since?Date.now()-t.since:0)}
function clock(){var s=Math.floor(elapsed()/1000);return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(function(n){return String(n).padStart(2,"0")}).join(":")}
function subOpts(sel){return S.subs.map(function(s){return'<option value="'+s.id+'"'+(s.id==sel?" selected":"")+">"+esc(s.name)+"</option>"}).join("")}
function v(id){return document.getElementById(id).value}

function addLog(sid,min,note){
  if(min<1)return;
  S.logs.push({id:uid(),sid:sid,date:today(),min:Math.round(min),note:note||"",cyc:S.cycleNo||1});
  var steps=(S.steps||"").split(",").map(function(x){return parseInt(x)}).filter(function(x){return x>0});
  if(v("revchk")&&steps.length&&document.getElementById("revchk").checked){
    var topic=(note||"").trim()||"Revisar "+sub(sid).name;
    steps.forEach(function(n){S.revs.push({id:uid(),sid:sid,topic:topic,due:addDays(today(),n),step:n,done:false})});
  }
}
function start(){if(!S.subs.length)return;S.timer={sid:v("tsub"),acc:0,since:Date.now()};save();render()}
function pause(){var t=S.timer;if(t.since){t.acc+=Date.now()-t.since;t.since=null}else t.since=Date.now();save();render()}
function stop(){var t=S.timer,note=v("tnote");var chk=document.getElementById("revchk");var c=chk&&chk.checked;
  addLogRaw(t.sid,elapsed()/60000,note,c);S.timer=null;save();render()}
function addLogRaw(sid,min,note,rev){
  if(min<1){return}
  S.logs.push({id:uid(),sid:sid,date:today(),min:Math.round(min),note:note||"",cyc:S.cycleNo||1});
  if(rev){var steps=(S.steps||"").split(",").map(function(x){return parseInt(x)}).filter(function(x){return x>0});
    var topic=(note||"").trim()||"Revisar "+sub(sid).name;
    steps.forEach(function(n){S.revs.push({id:uid(),sid:sid,topic:topic,due:addDays(today(),n),step:n,done:false})})}
}
function manual(){var m=parseInt(v("mmin"));if(!m||!S.subs.length)return;addLogRaw(v("msub"),m,v("mnote"),document.getElementById("revchk2").checked);save();render()}
function discard(){S.timer=null;save();render()}
function addSub(){var n=v("sname").trim();if(!n)return;var h=parseFloat(v("sh"))||0;
  S.subs.push({id:uid(),name:n,color:COLORS[S.subs.length%COLORS.length],cycleMin:Math.round(h*60)});save();render()}
function delSub(id){if(!confirm("Remover matéria e seus registros?"))return;S.subs=S.subs.filter(function(s){return s.id!=id});S.logs=S.logs.filter(function(l){return l.sid!=id});S.revs=S.revs.filter(function(l){return l.sid!=id});for(var d in S.plan)S.plan[d]=S.plan[d].filter(function(p){return p.sid!=id});save();render()}
function setH(id,val){var s=sub(id);s.cycleMin=Math.round((parseFloat(val)||0)*60);save();render()}
function newCycle(){if(!confirm("Iniciar um novo ciclo? O progresso do ciclo volta a zero (o histórico é mantido)."))return;
  S.cycles=S.cycles||[];S.cycleNo=S.cycleNo||1;
  S.cycles.push({n:S.cycleNo,start:S.cycleStart,end:today(),subs:S.subs.map(function(x){return{name:x.name,color:x.color,goal:x.cycleMin,done:cycleMin(x.id)}})});
  S.logs.forEach(function(l){if(!l.cyc)l.cyc=S.cycleNo});
  S.cycleNo++;S.cycleStart=today();save();render()}
function revDone(id){var r=S.revs.find(function(x){return x.id==id});r.done=!r.done;r.doneDate=r.done?today():null;save();render()}
function revDel(id){S.revs=S.revs.filter(function(x){return x.id!=id});save();render()}
function addRev(){var t=v("rtopic").trim();if(!t||!S.subs.length)return;S.revs.push({id:uid(),sid:v("rsub"),topic:t,due:v("rdate")||today(),step:0,done:false});save();render()}
function delLog(id){S.logs=S.logs.filter(function(l){return l.id!=id});save();render()}
function setSteps(x){S.steps=x;save()}
var DN=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"],ORD=[1,2,3,4,5,6,0];
function dow(s){return new Date(s+"T12:00:00").getDay()}
function planDay(d){return S.plan[d]||[]}
function plannedMin(date){return planDay(dow(date)).reduce(function(a,p){return a+p.min},0)}
function doneMin(date){return S.logs.filter(function(l){return l.date==date}).reduce(function(a,l){return a+l.min},0)}
function addPlan(d){var m=Math.round((parseFloat(v("ph"+d))||0)*60);if(!m){var hi=document.getElementById("ph"+d);hi.placeholder="digite as horas";hi.style.borderColor="var(--bad)";hi.focus();return}if(!S.subs.length)return;(S.plan[d]=S.plan[d]||[]).push({id:uid(),sid:v("ps"+d),min:m});save();render()}
function delPlan(d,id){S.plan[d]=planDay(d).filter(function(p){return p.id!=id});save();render()}
function startSub(sid){if(S.timer)return;S.timer={sid:sid,acc:0,since:Date.now()};save();render()}

function vEstudar(){
  if(!S.subs.length)return'<div class="card">Primeiro cadastre suas matérias na aba <b>Matérias</b>.</div>';
  var t=S.timer,h="";
  var chk='<label class="mu"><input type="checkbox" id="revchk" checked> Agendar revisões ('+esc(S.steps)+' dias)</label>';
  if(t){
    h+='<div class="card"><h3><span class="dot" style="background:'+sub(t.sid).color+'"></span>'+esc(sub(t.sid).name)+'</h3><div class="big" id="clk">'+clock()+'</div>'
     +'<input id="tnote" placeholder="O que você estudou? (opcional)" style="width:100%"><div class="row">'+chk+'</div>'
     +'<div class="row"><button class="b g" onclick="pause()">'+(t.since?"Pausar":"Continuar")+'</button><button class="b" onclick="stop()">Finalizar e salvar</button></div>'
     +'<button class="b g" style="width:100%" onclick="discard()">Descartar</button></div>';
  }else{
    h+='<div class="card"><h3>Cronômetro</h3><div class="row"><select id="tsub">'+subOpts()+'</select><button class="b" onclick="start()">Iniciar</button></div></div>';
  }
  h+='<div class="card"><h3>Registro manual</h3><div class="row"><select id="msub">'+subOpts()+'</select><input id="mmin" type="number" min="1" placeholder="minutos"></div>'
   +'<input id="mnote" placeholder="Conteúdo estudado (opcional)" style="width:100%"><div class="row"><label class="mu"><input type="checkbox" id="revchk2" checked> Agendar revisões</label></div>'
   +'<button class="b" style="width:100%" onclick="manual()">Salvar</button></div>';
  var pd=planDay(new Date().getDay()),agg={},ord=[];
  pd.forEach(function(p){if(!(p.sid in agg)){agg[p.sid]=0;ord.push(p.sid)}agg[p.sid]+=p.min});
  if(ord.length){h+='<h2>Cronograma de hoje · '+DN[new Date().getDay()]+'</h2>';ord.forEach(function(sid){
    var dn=S.logs.filter(function(l){return l.sid==sid&&l.date==today()}).reduce(function(a,l){return a+l.min},0),pl=agg[sid],pc=Math.min(100,Math.round(dn/pl*100));
    h+='<div class="card"><div class="row"><b><span class="dot" style="background:'+sub(sid).color+'"></span>'+esc(sub(sid).name)+(dn>=pl?" ✓":"")+'</b><span class="mu" style="text-align:right">'+fm(dn)+" / "+fm(pl)+'</span>'+(t?'':'<button class="b g" style="flex:0" onclick="startSub(\''+sid+'\')">▶</button>')+'</div><div class="bar"><i style="width:'+pc+'%;background:'+sub(sid).color+'"></i></div></div>'})}
  var rec=S.logs.slice(-5).reverse();
  if(rec.length){h+='<h2>Últimos registros</h2>';rec.forEach(function(l){h+='<div class="card row"><span><span class="dot" style="background:'+sub(l.sid).color+'"></span>'+esc(sub(l.sid).name)+' · '+fm(l.min)+'<div class="mu">'+l.date.split("-").reverse().join("/")+(l.note?" · "+esc(l.note):"")+'</div></span><button class="b g" style="flex:0" onclick="delLog(\''+l.id+'\')">✕</button></div>'})}
  return h}

function cycleMin(sid){return S.logs.filter(function(l){return l.sid==sid&&(l.cyc?l.cyc==S.cycleNo:l.date>=S.cycleStart)}).reduce(function(a,l){return a+l.min},0)}
function vCiclo(){
  if(!S.subs.length)return'<div class="card">Cadastre matérias na aba <b>Matérias</b> e defina as horas de cada uma no ciclo.</div>';
  var tot=0,got=0,h="";
  S.subs.forEach(function(s){tot+=s.cycleMin;got+=Math.min(cycleMin(s.id),s.cycleMin)});
  var pc=tot?Math.round(got/tot*100):0;
  h+='<div class="card"><h3>Ciclo atual <span class="mu">(desde '+S.cycleStart.split("-").reverse().join("/")+')</span></h3><div class="big">'+pc+'%</div><div class="bar"><i style="width:'+pc+'%;background:var(--ac)"></i></div><div class="mu" style="margin-top:6px">'+fm(got)+' de '+fm(tot)+'</div>'
   +(tot&&got>=tot?'<p><b>Ciclo completo! 🎉</b></p>':"")+'<button class="b g" style="width:100%;margin-top:8px" onclick="newCycle()">Iniciar novo ciclo</button></div>';
  S.subs.forEach(function(s){var m=cycleMin(s.id),p=s.cycleMin?Math.min(100,Math.round(m/s.cycleMin*100)):0,ok=s.cycleMin&&m>=s.cycleMin;
    h+='<div class="card"><div class="row"><b><span class="dot" style="background:'+s.color+'"></span>'+esc(s.name)+(ok?" ✓":"")+'</b><span class="mu" style="text-align:right">'+fm(m)+" / "+fm(s.cycleMin)+'</span></div><div class="bar"><i style="width:'+p+'%;background:'+s.color+'"></i></div>'
     +(s.cycleMin&&!ok?'<div class="mu">Faltam '+fm(s.cycleMin-m)+'</div>':"")+'</div>'});
  var next=S.subs.filter(function(s){return s.cycleMin>cycleMin(s.id)}).sort(function(a,b){return cycleMin(a.id)/a.cycleMin-cycleMin(b.id)/b.cycleMin})[0];
  if(next)h+='<div class="card">Sugestão de próxima matéria: <b>'+esc(next.name)+'</b></div>';
  if(S.cycles&&S.cycles.length){h+='<h2>Histórico de ciclos</h2>';S.cycles.slice().reverse().forEach(function(c){
    var g=0,d=0;c.subs.forEach(function(x){g+=x.goal;d+=Math.min(x.done,x.goal)});
    h+='<details class="card"><summary><b>Ciclo '+c.n+'</b> <span class="mu">'+c.start.split("-").reverse().join("/")+' a '+c.end.split("-").reverse().join("/")+' · '+(g?Math.round(d/g*100):0)+'%</span></summary>'
    +c.subs.map(function(x){return'<div class="row"><span style="flex:3"><span class="dot" style="background:'+x.color+'"></span>'+esc(x.name)+'</span><span class="mu" style="text-align:right">'+fm(x.done)+' / '+fm(x.goal)+'</span></div>'}).join("")+'</details>'})}
  return h}

function vRev(){
  var h='<div class="card"><h3>Intervalos das revisões</h3><div class="row"><input value="'+esc(S.steps)+'" onchange="setSteps(this.value)" placeholder="1,7,30"></div><div class="mu">Dias após estudar, separados por vírgula. Ex.: 1,7,30</div></div>';
  if(S.subs.length)h+='<div class="card"><h3>Nova revisão manual</h3><div class="row"><select id="rsub">'+subOpts()+'</select><input id="rdate" type="date" value="'+today()+'"></div><div class="row"><input id="rtopic" placeholder="Conteúdo a revisar"><button class="b" style="flex:0" onclick="addRev()">+</button></div></div>';
  var t=today(),open=S.revs.filter(function(r){return!r.done}).sort(function(a,b){return a.due<b.due?-1:1}),dn=S.revs.filter(function(r){return r.done}).slice(-5);
  function item(r){var late=!r.done&&r.due<t;return'<div class="card row'+(r.done?" done":"")+'"><span style="flex:3"><span class="dot" style="background:'+sub(r.sid).color+'"></span>'+esc(r.topic)+'<div class="mu '+(late?"late":"")+'">'+esc(sub(r.sid).name)+" · "+(r.due==t?"hoje":late?"atrasada ("+r.due.split("-").reverse().join("/")+")":r.due.split("-").reverse().join("/"))+(r.step?" · D+"+r.step:"")+'</div></span><button class="b g" style="flex:0" onclick="revDone(\''+r.id+'\')">'+(r.done?"↩":"✓")+'</button><button class="b g" style="flex:0" onclick="revDel(\''+r.id+'\')">✕</button></div>'}
  h+='<h2>Pendentes ('+open.length+')</h2>'+(open.length?open.map(item).join(""):'<div class="mu">Nenhuma revisão pendente.</div>');
  if(dn.length)h+='<h2>Concluídas recentemente</h2>'+dn.map(item).join("");
  return h}

function vGraf(){
  if(!S.logs.length)return'<div class="card">Registre estudos para ver os gráficos.</div>';
  var h="",days=[],i;
  for(i=6;i>=0;i--)days.push(addDays(today(),-i));
  var vals=days.map(function(d){return S.logs.filter(function(l){return l.date==d}).reduce(function(a,l){return a+l.min},0)}),mx=Math.max.apply(null,vals)||1;
  var wk=vals.reduce(function(a,b){return a+b},0),all=S.logs.reduce(function(a,l){return a+l.min},0);
  h+='<div class="card"><h3>Últimos 7 dias · '+fm(wk)+'</h3><div class="chart">'+days.map(function(d,k){return'<div>'+(vals[k]?fm(vals[k]):"")+'<i style="height:'+Math.round(vals[k]/mx*100)+'%"></i>'+["D","S","T","Q","Q","S","S"][new Date(d+"T12:00:00").getDay()]+'</div>'}).join("")+'</div></div>';
  var per=S.subs.map(function(s){return{s:s,m:S.logs.filter(function(l){return l.sid==s.id}).reduce(function(a,l){return a+l.min},0)}}).sort(function(a,b){return b.m-a.m}),pm=per[0].m||1;
  h+='<div class="card"><h3>Por matéria · total '+fm(all)+'</h3>'+per.map(function(p){return'<div style="margin:8px 0"><div class="row" style="margin:0"><span><span class="dot" style="background:'+p.s.color+'"></span>'+esc(p.s.name)+'</span><span class="mu" style="text-align:right">'+fm(p.m)+" ("+Math.round(p.m/all*100)+'%)</span></div><div class="bar"><i style="width:'+Math.round(p.m/pm*100)+'%;background:'+p.s.color+'"></i></div></div>'}).join("")+'</div>';
  if(ORD.some(function(d){return planDay(d).length})){
    var pr=days.map(function(d){return{d:d,p:plannedMin(d),m:doneMin(d)}});
    h+='<div class="card"><h3>Cronograma: planejado x estudado (7 dias)</h3>'+pr.map(function(x){var pc=x.p?Math.min(100,Math.round(x.m/x.p*100)):0;return'<div style="margin:8px 0"><div class="row" style="margin:0"><span>'+DN[dow(x.d)].slice(0,3)+' '+x.d.slice(8)+'/'+x.d.slice(5,7)+'</span><span class="mu" style="text-align:right">'+fm(x.m)+(x.p?" / "+fm(x.p):"")+'</span></div>'+(x.p?'<div class="bar"><i style="width:'+pc+'%;background:var(--ac)"></i></div>':"")+'</div>'}).join("")+'</div>'}
  var rv=days.map(function(d){return S.revs.filter(function(r){return r.done&&(r.doneDate||r.due)==d}).length}),rmx=Math.max.apply(null,rv)||1,rt=rv.reduce(function(a,b){return a+b},0),pend=S.revs.filter(function(r){return!r.done}).length;
  h+='<div class="card"><h3>Revisões feitas (7 dias) · '+rt+' · pendentes: '+pend+'</h3><div class="chart">'+days.map(function(d,k){return'<div>'+(rv[k]||"")+'<i style="height:'+Math.round(rv[k]/rmx*100)+'%;background:var(--ok)"></i>'+["D","S","T","Q","Q","S","S"][new Date(d+"T12:00:00").getDay()]+'</div>'}).join("")+'</div></div>';
  var wks=[];for(i=5;i>=0;i--){var e=addDays(today(),-7*i),b=addDays(e,-6);wks.push({b:b,e:e,m:S.logs.filter(function(l){return l.date>=b&&l.date<=e}).reduce(function(a,l){return a+l.min},0)})}
  var wm=Math.max.apply(null,wks.map(function(w){return w.m}))||1;
  h+='<div class="card"><h3>Últimas 6 semanas</h3><div class="chart">'+wks.map(function(w){return'<div>'+(w.m?fm(w.m):"")+'<i style="height:'+Math.round(w.m/wm*100)+'%"></i>'+w.e.slice(8)+"/"+w.e.slice(5,7)+'</div>'}).join("")+'</div></div>';
  return h}

function vMat(){
  var h='<div class="card"><h3>Nova matéria</h3><div class="row"><input id="sname" placeholder="Nome (ex.: Português)"><input id="sh" type="number" step="0.5" min="0" placeholder="horas no ciclo"></div><button class="b" style="width:100%" onclick="addSub()">Adicionar</button></div>';
  S.subs.forEach(function(s){h+='<div class="card row"><span style="flex:3"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.name)+'</span><input type="number" step="0.5" min="0" value="'+(s.cycleMin/60)+'" onchange="setH(\''+s.id+'\',this.value)" style="flex:1.2" title="horas no ciclo"><span class="mu" style="flex:0">h</span><button class="b g" style="flex:0" onclick="delSub(\''+s.id+'\')">✕</button></div>'});
  h+=user?'<div class="card"><h3>Conta</h3><div class="mu">'+esc(user.email)+'</div><div class="mu" id="syncst">'+esc(syncMsg)+'</div><div class="row"><button class="b g" onclick="syncNow()">Sincronizar agora</button><button class="b g" onclick="logout()">Sair</button></div></div>':'<div class="card"><h3>Conta</h3><div class="mu">Modo sem conta: os dados ficam salvos só neste aparelho e navegador.</div>'+(sb?'<button class="b" style="width:100%;margin-top:8px" onclick="needAuth=true;render()">Entrar / criar conta</button>':'')+'</div>';
  return h}

function vCron(){
  if(!S.subs.length)return'<div class="card">Cadastre matérias na aba <b>Matérias</b> para montar o cronograma.</div>';
  var h='<div class="mu" style="margin:4px 0">Defina, para cada dia da semana, quais matérias estudar e por quantas horas.</div>',tw=0,td=new Date().getDay();
  ORD.forEach(function(d){var items=planDay(d),tot=items.reduce(function(a,p){return a+p.min},0);tw+=tot;
    h+='<div class="card"'+(d==td?' style="border-color:var(--ac)"':'')+'><div class="row" style="margin:0 0 4px"><h3 style="margin:0">'+DN[d]+(d==td?' · hoje':'')+'</h3><span class="mu" style="text-align:right">'+(tot?fm(tot):"livre")+'</span></div>'
    +items.map(function(p){return'<div class="row"><span style="flex:3"><span class="dot" style="background:'+sub(p.sid).color+'"></span>'+esc(sub(p.sid).name)+'</span><span class="mu" style="flex:1;text-align:right">'+fm(p.min)+'</span><button class="b g" style="flex:0" onclick="delPlan('+d+',\''+p.id+'\')">✕</button></div>'}).join("")
    +'<div class="row"><select id="ps'+d+'">'+subOpts()+'</select><input id="ph'+d+'" type="number" step="0.5" min="0" placeholder="horas"><button class="b" style="flex:0 0 auto" onclick="addPlan('+d+')">+ Adicionar</button></div></div>'});
  return h+'<div class="card">Total da semana: <b>'+fm(tw)+'</b></div>'}
var TABS=[["estudar","⏱ Estudar",vEstudar],["ciclo","🔄 Ciclo",vCiclo],["cron","📅 Cronograma",vCron],["rev","🧠 Revisões",vRev],["graf","📊 Gráficos",vGraf],["mat","📚 Matérias",vMat]];
function render(){
  var navEl=document.getElementById("nav");
  if(needAuth){navEl.style.display="none";document.getElementById("app").innerHTML=vAuth();return}
  navEl.style.display="";
  var keep={};["tnote","mnote","mmin","tsub","msub"].forEach(function(i){var e=document.getElementById(i);if(e)keep[i]=e.value});
  document.getElementById("app").innerHTML=TABS.filter(function(t){return t[0]==tab})[0][2]();
  document.getElementById("nav").innerHTML=TABS.map(function(t){return'<button class="'+(t[0]==tab?"on":"")+'" onclick="go(\''+t[0]+'\')"><span class="ic">'+t[1].split(" ")[0]+'</span><span class="lb">'+t[1].split(" ").slice(1).join(" ")+'</span></button>'}).join("");
  for(var k in keep){var e=document.getElementById(k);if(e)e.value=keep[k]}
  var due=S.revs.filter(function(r){return!r.done&&r.due<=today()}).length;
  if(due&&tab!="rev"){var b=document.getElementById("nav").children[3];b.querySelector(".ic").innerHTML+='<span class="bd">'+due+'</span>'}
}
function go(t){tab=t;render();window.scrollTo(0,0)}
setInterval(function(){var c=document.getElementById("clk");if(c)c.textContent=clock()},1000);
init();
</script>
</body>
